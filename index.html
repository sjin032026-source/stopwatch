<title>랩 스탑워치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  /* Layout: one narrow column — big readout, two buttons, lap list */
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --ink: #1c1d1f;
    --muted: #7b7e84;
    --rule: #e3e3e0;
    --accent: #2f5bd3;
    --good: #1f8a5b;
    --bad: #c2362f;
    --font-digit: "DM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121315; --surface: #1b1c1f; --ink: #ececee; --muted: #8d9097; --rule: #2a2c30;
      --accent: #7d9bff; --good: #5cc795; --bad: #f07b72; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121315; --surface: #1b1c1f; --ink: #ececee; --muted: #8d9097; --rule: #2a2c30;
    --accent: #7d9bff; --good: #5cc795; --bad: #f07b72; color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-block: 56px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .watch { max-width: 420px; margin: 0 auto; display: grid; gap: 32px; }

  .readout {
    text-align: center;
    font-family: var(--font-digit);
    font-weight: 300;
    font-size: clamp(3rem, 15vw, 4.5rem);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .readout small { font-size: .5em; color: var(--muted); }
  .lapnow {
    text-align: center;
    margin-top: 12px;
    font-family: var(--font-digit);
    font-size: .9rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: 500 1rem var(--font-body);
    padding: 14px 0;
    border-radius: 12px;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  button.primary.running { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  .hint { text-align: center; font-size: .78rem; color: var(--muted); display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  kbd { font-family: var(--font-digit); font-size: .72rem; padding: 1px 5px; border: 1px solid var(--rule); border-radius: 4px; }

  .laps-head, .lap {
    display: grid;
    grid-template-columns: 3rem 1fr 1fr;
    gap: 8px;
    padding: 11px 2px;
    font-variant-numeric: tabular-nums;
  }
  .laps-head {
    font-size: .75rem;
    color: var(--muted);
    border-bottom: 1px solid var(--rule);
  }
  .laps-head span:not(:first-child), .lap span:not(:first-child) { text-align: right; }
  .lap { border-bottom: 1px solid var(--rule); font-family: var(--font-digit); font-size: .92rem; }
  .lap .n, .lap .total { color: var(--muted); }
  .lap.best .split { color: var(--good); }
  .lap.worst .split { color: var(--bad); }
  .empty { padding: 20px 2px; color: var(--muted); font-size: .88rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<main class="watch">
  <div>
    <div class="readout" id="readout" aria-live="off">00:00<small>.00</small></div>
    <div class="lapnow" id="lapnow">랩 1 · 00:00.00</div>
  </div>

  <div class="controls">
    <button id="secondary" type="button" disabled>랩</button>
    <button id="primary" type="button" class="primary">시작</button>
  </div>
  <div class="hint">
    <span><kbd>Space</kbd> 시작/정지</span>
    <span><kbd>L</kbd> 랩</span>
    <span><kbd>R</kbd> 리셋</span>
  </div>

  <section aria-label="랩 기록">
    <div class="laps-head"><span>랩</span><span>구간</span><span>누적</span></div>
    <div id="lapList"></div>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const readout = $("readout"), lapnow = $("lapnow"), lapList = $("lapList");
  const primary = $("primary"), secondary = $("secondary");
  const EMPTY = '<div class="empty">실행 중에 랩을 누르면 구간 기록이 표시됩니다.</div>';

  // State: elapsed = banked ms + (now - startedAt) while running
  let banked = 0, startedAt = null, laps = [], raf = null;

  const elapsed = () => banked + (startedAt === null ? 0 : performance.now() - startedAt);
  const pad = (n, w = 2) => String(n).padStart(w, "0");
  function fmt(ms) {
    const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
    return { main: (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s), frac: "." + pad(cs) };
  }
  const flat = (ms) => { const f = fmt(ms); return f.main + f.frac; };
  const lastLapTotal = () => (laps.length ? laps[laps.length - 1].total : 0);

  function draw() {
    const ms = elapsed(), f = fmt(ms);
    readout.innerHTML = f.main + "<small>" + f.frac + "</small>";
    lapnow.textContent = "랩 " + (laps.length + 1) + " · " + flat(ms - lastLapTotal());
  }
  function loop() { draw(); raf = requestAnimationFrame(loop); }

  function renderLaps() {
    if (!laps.length) { lapList.innerHTML = EMPTY; return; }
    const splits = laps.map((l) => l.split);
    const best = laps.length > 1 ? Math.min(...splits) : null;
    const worst = laps.length > 1 ? Math.max(...splits) : null;
    lapList.innerHTML = laps.slice().reverse().map((l, idx) => {
      const n = laps.length - idx;
      const cls = l.split === best ? " best" : l.split === worst ? " worst" : "";
      return '<div class="lap' + cls + '"><span class="n">' + pad(n) + '</span><span class="split">' +
        flat(l.split) + '</span><span class="total">' + flat(l.total) + "</span></div>";
    }).join("");
  }

  function syncButtons() {
    const running = startedAt !== null;
    primary.textContent = running ? "정지" : banked > 0 ? "재개" : "시작";
    primary.classList.toggle("running", running);
    secondary.textContent = running || banked === 0 ? "랩" : "리셋";
    secondary.disabled = !running && banked === 0;
  }

  function toggle() {
    if (startedAt === null) {
      startedAt = performance.now();
      loop();
    } else {
      banked = elapsed(); startedAt = null;
      cancelAnimationFrame(raf); draw();
    }
    syncButtons();
  }
  function lap() {
    if (startedAt === null) return;
    const total = elapsed();
    laps.push({ split: total - lastLapTotal(), total });
    renderLaps();
  }
  function reset() {
    if (startedAt !== null) return;
    banked = 0; laps = [];
    draw(); renderLaps(); syncButtons();
  }

  primary.addEventListener("click", toggle);
  secondary.addEventListener("click", () => (startedAt !== null ? lap() : reset()));
  document.addEventListener("keydown", (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.key === "l" || e.key === "L") lap();
    else if (e.key === "r" || e.key === "R") reset();
  });

  // Keep the running time across a live republish
  window.claude?.hot?.snapshot?.(() => ({ banked: elapsed(), running: startedAt !== null, laps }));
  function start(data) {
    banked = data.banked || 0; laps = data.laps || [];
    renderLaps(); draw(); syncButtons();
    if (data.running) toggle();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
